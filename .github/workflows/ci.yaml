# Goal - I have a lint,Build,Test the code for Frontend and Backend 
#Then push the image to Docker Hub

name: CI

on: 
  push: 
     paths: 
        - '**'
        - '!.github/workflows/**'
     branches: [master]


jobs: 
   frontend:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout code
             uses: actions/checkout@v7

           - name: Set up Node.js
             uses: actions/setup-node@v6
             with:
               node-version: '20'
               cache: 'npm'
               cache-dependency-path: frontend/package-lock.json


           - name: Install npm packages                
             run: npm ci 
             working-directory: ./frontend

           - name: Run Linter
             run: npm run lint
             working-directory: ./frontend

           - name: Run Tests
             run: npm run test     
             working-directory: ./frontend


           - name: Docker Setup
             uses: docker/login-action@v4
             with:
               username: ${{ vars.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}
 
           - name: Docker build and push
             uses: docker/build-push-action@v7
             with:
               context: ./frontend
               file: ./frontend/Dockerfile
               push: True
               tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest  

   backend:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout code
             uses: actions/checkout@v7

           - name: Set up go
             uses: actions/setup-go@v7
             with:
               go-version: '1.23'
               go-version-file: 'go.mod'
               cache: true
               cache-dependency-path: backend/go.sum

           - name: Run go formatter
             run: go fmt
             working-directory: ./backend  

           - name: Run go Vet
             run: go vet 
             working-directory: ./backend 

           - name: Run Tests
             run: go test 
             working-directory: ./backend

           - name: Docker Setup Login
             uses: docker/login-action@v4
             with:
               username: ${{ vars.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}
 
           - name: Docker build and push
             uses: docker/build-push-action@v7
             with:
               context: ./backend
               file: ./backend/Dockerfile
               push: True
               tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest 

   Deploy: 
        needs: [frontend, backend]
        uses: ./.github/workflows/cd.yaml 
        secrets: inherit
   