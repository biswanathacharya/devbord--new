# Goal - I have a lint,Build,Test the code for Frontend and Backend 
#Then push the image to Docker Hub

name: CI

on: 
  push: 
    branches: [advanced]

jobs: 
   frontend:
        runs-on: ubuntu-latest
        steps:
           - name: Checkout code
             uses: actions/checkout@v7

           - name: Set up Node.js
             uses: actions/setup-node@v6
             with:
               node-version: '20'
               cache: 'npm'
               cache-dependency-path: frontend/package-lock.json


           - name: Install npm packages                
             run: npm ci 
             working-directory: ./frontend

           - name: Run Linter
             run: npm run lint
             working-directory: ./frontend

           - name: Run Tests
             run: npm run test     
             working-directory: ./frontend
             