# Goal: to ensure no secrets have been leaked in the code

name: Secret Scanning

on: 
  workflow_call: 
jobs:
   scan-secrets:
       runs-on: ubuntu-latest
       steps: 
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0

            - name: GitLeaks Scanner
              uses: actions/gitleaks-action@v2

              
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   