#Goal: To run the End to end Devsecops Pipeline 

name: Devsecops

on:
  push:
    branches: [master]

jobs:
  # Code  stage (with Shift Left)
   code-quality:
    uses: ./.github/workflows/code-quality.yml


    # Secret scanning
   secret-scanning:
      uses: ./.github/workflows/secret-scanning.yml


     # Dependency Scan Check
   dependency-scan: 
       uses: ./.github/workflows/dependency-scan.yml
    
       # Docker Checks
   docker-scan:
       uses: ./.github/workflows/docker-scans.yml
       secrets: inherit
       
       #Sonarqube    
   sonar-qube:
             uses: ./.github/workflows/sonar-scans.yml
             secrets: inherit 
   code-tests:
        uses: ./.github/workflows/code-tests.yml
        
        #Push to DockerHub
   docker-push:
       uses: ./.github/workflows/dockerpush.yaml
       needs: [code-quality,code-tests,docker-scan,sonar-qube,dependency-scan, secret-scanning]      
       secrets: inherit 

    ##------CD----------
    
   deploy: 
       needs: [docker-push]
       uses: ./.github/workflows/deploy.yaml  
       secrets: inherit 