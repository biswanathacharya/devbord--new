# Goal: To ensure the Dockerfile &  Docker images has been security Tested
name: Docker scan

on: 
   workflow_call

jobs:
   docker-file-linting:
        runs-on: ubuntu-latest
        strategy: 
             fail-fast: false
             matrix:
                 folders: ['backend','frontend']
        steps: 
           - name: Code Checkout
             uses: actions/checkout@v7
          
           - name: Dockerfile Lint
             uses: hadolint/hadolint-action@v3.1.0
             with: 
                dockerfile: ${{ matrix.folders }}/Dockerfile
                  
                 

   
              