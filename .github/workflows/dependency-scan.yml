# Goal: I have to ensure the packages & dependencies have been audited for security

name: Dependency Scanning

on:
  workflow_call:

jobs: 
   dependency-scan:
       runs-on: ubuntu-latest
       steps:
           - name: Code Checkout
             uses: actions/checkout@v4

           - name: Setup Go
             uses: actions/setup-go@v5
             with: 
              go-version-file: 'backend/go.mod'
              cache: true
              cache-dependency-path: backend/go.sum

             
        # 3. Install Govulncheck
           - name: Install Govulncheck
             continue-on-error: true
             run: govluncheck ./...> govluncheck-report.txt
             working-directory: backend


           - name: Download Go Dependencies
             run: go mod download
             working-directory: backend
    

           - name: Govulncheck
             run: govulncheck ./...      
             working-directory: backend


           - name: Setup Node
             uses: actions/setup-node@v6
             with: 
                node-version: 20
                cache: npm
                cache-dependency-path: frontend/package-lock.json
                
           - name: Run dependency scan for Node
             run: npm audit
             working-directory: frontend
  
           - name: Upload Report to Artifacts
             uses: actions/upload-artifact@v4
             with:
                name: dependency-scan-report
                path: reports/dependency-report.txt
                retention-days: 5

