# Goal : To insatll  multiple version of Go and do linting for multiple version

name: Go Linter

on: 
  workflow_dispatch:

jobs: 
    code-format: 
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
                go-version: [1.25, 1.26, 1.27]
        steps: 
           - name: Code Checkout
             uses: actions/checkout@v7
           - name: Setup Go
             uses: actions/setup-go@v6
             with: 
                go-version: ${{ matrix.go-version }}
                go-version-file: 'go.mod'
                cache-dependency-path: go.sum

           - name: Run go formatter
             run: go fmt
             working-directory: backend       

           - name: Run go Vet
             run: go vet
             working-directory:  backend                  
