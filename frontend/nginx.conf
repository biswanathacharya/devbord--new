
server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ai/ {
        proxy_pass http://ai-service:3005/;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
    }

    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
    }
}
